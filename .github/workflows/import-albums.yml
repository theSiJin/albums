name: Import albums to D1

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate SQL
        shell: python
        run: |
          import csv

          INPUT = "spreadsheet.csv"
          OUTPUT = "/tmp/import.sql"

          def sql_escape(value):
              if value is None:
                  return ""
              return value.replace("'", "''")

          imported = 0
          skipped = 0
          skipped_rows = []

          with open(INPUT, "r", encoding="utf-8-sig", newline="") as f:
              reader = csv.reader(f)
              rows = list(reader)

          with open(OUTPUT, "w", encoding="utf-8") as out:
              for row_number, row in enumerate(rows, start=1):

                  # We expect at least 11 columns.
                  if len(row) < 11:
                      skipped += 1
                      skipped_rows.append(
                          f"Row {row_number}: only {len(row)} columns"
                      )
                      continue

                  (
                      _,
                      album,
                      artist,
                      year,
                      listened_on,
                      reasons,
                      artwork,
                      discogs,
                      main_artists,
                      genres,
                      styles,
                  ) = row[:11]

                  album = album.strip()
                  artist = artist.strip()
                  year = year.strip()
                  listened_on = listened_on.strip()
                  reasons = reasons.strip()
                  artwork = artwork.strip()
                  discogs = discogs.strip()
                  main_artists = main_artists.strip()
                  genres = genres.strip()
                  styles = styles.strip()

                  # album and artist are required by the D1 schema.
                  if not album or not artist:
                      skipped += 1
                      skipped_rows.append(
                          f"Row {row_number}: album={album!r}, artist={artist!r}"
                      )
                      continue

                  # Convert year to SQL NULL when empty/non-numeric.
                  if year.isdigit():
                      year_sql = year
                  else:
                      year_sql = "NULL"

                  sql = f"""
          INSERT INTO albums (
              album,
              artist,
              year,
              listened_on,
              reasons,
              artwork_url,
              discogs_url,
              main_artists,
              genres,
              styles
          ) VALUES (
              '{sql_escape(album)}',
              '{sql_escape(artist)}',
              {year_sql},
              '{sql_escape(listened_on)}',
              '{sql_escape(reasons)}',
              '{sql_escape(artwork)}',
              '{sql_escape(discogs)}',
              '{sql_escape(main_artists)}',
              '{sql_escape(genres)}',
              '{sql_escape(styles)}'
          );
          """

                  out.write(sql)
                  imported += 1

          print(f"Total CSV rows: {len(rows)}")
          print(f"Imported rows: {imported}")
          print(f"Skipped rows: {skipped}")

          if skipped_rows:
              print("")
              print("Skipped rows:")
              for item in skipped_rows:
                  print(item)

      - name: Show generated SQL statistics
        run: |
          echo "SQL file:"
          wc -l /tmp/import.sql
          echo "SQL size:"
          du -h /tmp/import.sql

      - name: Import into D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute albums-db --remote --file=/tmp/import.sql --yes

      - name: Verify import
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute albums-db --remote --command="SELECT COUNT(*) AS total FROM albums; SELECT COUNT(*) AS missing_artist FROM albums WHERE artist IS NULL OR artist = ''; SELECT id, album, artist, year FROM albums ORDER BY id LIMIT 10;"
