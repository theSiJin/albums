export default {
  async fetch(request, env) {
    const url = new URL(request.url);

    // --------------------------------------------------
    // GET /
    // --------------------------------------------------
    if (url.pathname === "/") {
      return new Response("Albums API is running\n", {
        headers: {
          "content-type": "text/plain; charset=utf-8",
        },
      });
    }

    // --------------------------------------------------
    // GET /db-test
    // --------------------------------------------------
    if (url.pathname === "/db-test") {
      const result = await env.DB
        .prepare("SELECT 1 AS ok")
        .first();

      return Response.json(result);
    }

    // --------------------------------------------------
    // GET /next
    //
    // Return one album that has not been listened to
    // or skipped yet.
    // --------------------------------------------------
    if (url.pathname === "/next" && request.method === "GET") {
      const album = await env.DB
        .prepare(`
          SELECT
            a.id,
            a.album,
            a.artist,
            a.year,
            a.listened_on,
            a.reasons,
            a.artwork_url,
            a.discogs_url,
            a.main_artists,
            a.genres,
            a.styles,
            COALESCE(l.status, 'unheard') AS status
          FROM albums a
          LEFT JOIN listening l
            ON a.id = l.album_id
          WHERE COALESCE(l.status, 'unheard') = 'unheard'
          ORDER BY RANDOM()
          LIMIT 1
        `)
        .first();

      if (!album) {
        return Response.json(
          {
            error: "No unheard albums remaining",
          },
          { status: 404 }
        );
      }

      return Response.json(album);
    }

    // --------------------------------------------------
    // POST /done
    //
    // Mark an album as listened.
    //
    // Body:
    // {
    //   "album_id": 123
    // }
    // --------------------------------------------------
    if (url.pathname === "/done" && request.method === "POST") {
      let body;

      try {
        body = await request.json();
      } catch {
        return Response.json(
          {
            error: "Invalid JSON body",
          },
          { status: 400 }
        );
      }

      const albumId = Number(body.album_id);

      if (!Number.isInteger(albumId) || albumId <= 0) {
        return Response.json(
          {
            error: "album_id must be a positive integer",
          },
          { status: 400 }
        );
      }

      // Make sure the album exists.
      const album = await env.DB
        .prepare(`
          SELECT id, album, artist
          FROM albums
          WHERE id = ?
        `)
        .bind(albumId)
        .first();

      if (!album) {
        return Response.json(
          {
            error: "Album not found",
          },
          { status: 404 }
        );
      }

      const now = new Date().toISOString();

      await env.DB
        .prepare(`
          INSERT INTO listening (
            album_id,
            status,
            listened_on,
            updated_at
          )
          VALUES (?, 'listened', ?, ?)
          ON CONFLICT(album_id) DO UPDATE SET
            status = 'listened',
            listened_on = excluded.listened_on,
            updated_at = excluded.updated_at
        `)
        .bind(albumId, now, now)
        .run();

      return Response.json({
        ok: true,
        album_id: albumId,
        status: "listened",
        listened_on: now,
        album: album.album,
        artist: album.artist,
      });
    }

    // --------------------------------------------------
    // 404
    // --------------------------------------------------
    return new Response("Not found\n", {
      status: 404,
    });
  },
};
